    <style>
        :root {

            --sun2: #e74c3c;
            --bg: #0d0d1a;
            --card: #16213e;
            --card2: #1a1a35;
            --text: #ffffff;
            --muted: #aaaacc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {

            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        .lang-switcher {
            position: fixed;
            top: 16px; right: 16px;
            z-index: 1000;
        }
        .lang-btn {
            background: rgba(243,156,18,0.15);
            border: 1.5px solid var(--sun);
            color: var(--sun);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .lang-btn:hover { background: rgba(243,156,18,0.3); }
        .lang-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--card);
            border: 1px solid rgba(243,156,18,0.3);
            border-radius: 14px;
            overflow: hidden;
            min-width: 160px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .lang-switcher.open .lang-dropdown { display: block; }
        .lang-option {
            padding: 12px 18px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
            display: flex; align-items: center; gap: 10px;
        }
        .lang-option:hover { background: rgba(243,156,18,0.15); }
        .lang-option.active { color: var(--sun); font-weight: 700; }
        .lang-flag { font-size: 18px; }

        header {
            text-align: center;
            padding: 80px 20px 50px;
            background: linear-gradient(180deg, #1a0a00 0%, #2d1b00 40%, var(--bg) 100%);
        }
        header h1 {
            font-size: clamp(1.8em, 5vw, 2.8em);
            font-weight: 900;
            background: linear-gradient(135deg, #f39c12, #e74c3c, #f1c40f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: var(--muted); margin-top: 10px; font-size: 0.95em; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            color: var(--sun);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 1; }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 20px 60px;
        }

        .section {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px;
            padding: 28px 28px 24px;
            margin-bottom: 20px;
        }
        .section:hover { border-color: rgba(243,156,18,0.2); }

        h2 {
            color: var(--sun);
            font-size: 1.15em;
            font-weight: 800;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2 .icon { font-size: 1.2em; }

        p { color: #ccc; margin-bottom: 12px; font-size: 0.95em; }
        p:last-child { margin-bottom: 0; }
        ul { color: #ccc; font-size: 0.95em; padding-left: 20px; margin-bottom: 12px; }
        ul li { margin-bottom: 6px; }
        a { color: var(--sun); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .table-wrap { overflow-x: auto; margin: 12px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88em; color: #ccc; }
        th { background: rgba(243,156,18,0.1); color: var(--sun); text-align: left; padding: 10px 14px; font-weight: 700; }
        td { padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:last-child td { border-bottom: none; }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #555;
            font-size: 0.85em;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        footer a:hover { color: #aaa; }

        @media (max-width: 500px) {
            .section { padding: 20px 16px; }
            header { padding: 70px 16px 40px; }

function renderPolicy(lang) {
    document.getElementById('policyContent').innerHTML = lang.sections.map(s => `
        <div class="section">
            <h2><span class="icon">${s.icon}</span>${s.title}</h2>
            ${s.content}
        </div>
    `).join('');
}

function toggleLang() {
    document.getElementById('langSwitcher').classList.toggle('open');
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('#langSwitcher')) {
        document.getElementById('langSwitcher').classList.remove('open');
    }
});

function setLang(key) {
    const lang = LANGS[key];
    document.getElementById('langSwitcher').classList.remove('open');
    document.getElementById('currentFlag').textContent = lang.flag;
    document.getElementById('currentLang').textContent = lang.label;
    document.documentElement.lang = key;
    document.title = `Falling Sun – ${lang.title}`;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (lang[k] !== undefined) el.innerHTML = lang[k];
    });
    document.querySelectorAll('.lang-option').forEach(opt => {
        opt.classList.toggle('active', opt.getAttribute('onclick') === `setLang('${key}')`);
    });
    renderPolicy(lang);
    localStorage.setItem('fallingSunLang', key);
}

const savedLang = localStorage.getItem('fallingSunLang') || 'en';
setLang(savedLang);
